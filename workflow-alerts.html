<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Alerts - URGENTWIRE REPORT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #0047AB 0%, #1E90FF 50%, #00BFFF 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            background: rgba(0, 0, 0, 0.3);
            color: #000;
            padding: 40px 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 
                         0 0 20px rgba(0, 0, 0, 0.6),
                         0 0 30px rgba(0, 0, 0, 0.4);
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .back-button {
            display: inline-block;
            background: rgba(0, 0, 0, 0.4);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
        }
        
        .workflow-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #0047AB;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .workflow-header h2 {
            color: #0047AB;
            font-size: 1.8em;
            flex: 1;
        }
        
        .workflow-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            color: white;
        }
        
        .workflow-badge.success {
            background: #28a745;
        }
        
        .workflow-badge.failure {
            background: #DC143C;
            animation: pulse 2s infinite;
        }
        
        .workflow-badge.pending {
            background: #FFA500;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(220, 20, 60, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 20, 60, 0);
            }
        }
        
        .workflow-info {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .workflow-info span {
            display: block;
        }
        
        .workflow-info strong {
            color: #0047AB;
        }
        
        .workflow-status {
            background: rgba(0, 71, 171, 0.05);
            padding: 15px;
            border-left: 4px solid #0047AB;
            border-radius: 5px;
            margin: 15px 0;
        }
        
        .workflow-status h3 {
            color: #0047AB;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .status-item {
            padding: 8px 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-icon {
            font-size: 1.2em;
        }
        
        .no-workflows {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .no-workflows p {
            color: #666;
            font-size: 1.1em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #000;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #000;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .recent-runs {
            margin-top: 20px;
        }
        
        .run-item {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #0047AB;
        }
        
        .run-time {
            font-size: 0.9em;
            color: #999;
        }
        
        footer {
            background: rgba(0, 0, 0, 0.5);
            color: #000;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>⚙️ Workflow Alerts</h1>
        <p>URGENTWIRE REPORT - GitHub Actions Status & Updates</p>
    </header>
    
    <div class="container">
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div id="workflows-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading workflow information...</p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 URGENTWIRE REPORT - Workflow Alerts | All rights reserved.</p>
    </footer>
    
    <script>
        async function loadWorkflows() {
            const container = document.getElementById('workflows-container');
            
            try {
                // Fetch workflow runs from GitHub API
                const response = await fetch(
                    'https://api.github.com/repos/christianlvillarreal/Christianlvillarreal.github.io/actions/runs?per_page=10'
                );
                
                if (!response.ok) {
                    throw new Error('Failed to fetch workflow data');
                }
                
                const data = await response.json();
                const runs = data.workflow_runs || [];
                
                if (runs.length === 0) {
                    container.innerHTML = `
                        <div class="no-workflows">
                            <p>📭 No workflow runs yet. Workflows will appear here when GitHub Actions are triggered.</p>
                        </div>
                    `;
                    return;
                }
                
                // Group runs by workflow name
                const workflowMap = {};
                runs.forEach(run => {
                    const name = run.name || 'Unnamed Workflow';
                    if (!workflowMap[name]) {
                        workflowMap[name] = [];
                    }
                    workflowMap[name].push(run);
                });
                
                let workflowsHTML = '';
                
                Object.entries(workflowMap).forEach(([workflowName, workflowRuns]) => {
                    const latestRun = workflowRuns[0];
                    const conclusion = latestRun.conclusion;
                    const status = latestRun.status;
                    
                    let badgeClass = 'workflow-badge pending';
                    let badgeText = '⏳ Pending';
                    
                    if (conclusion === 'success') {
                        badgeClass = 'workflow-badge success';
                        badgeText = '✅ Success';
                    } else if (conclusion === 'failure') {
                        badgeClass = 'workflow-badge failure';
                        badgeText = '❌ Failed';
                    } else if (conclusion === 'cancelled') {
                        badgeClass = 'workflow-badge';
                        badgeText = '⊘ Cancelled';
                    } else if (status === 'in_progress') {
                        badgeClass = 'workflow-badge pending';
                        badgeText = '⏳ In Progress';
                    }
                    
                    const runDate = new Date(latestRun.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    workflowsHTML += `
                        <div class="workflow-container">
                            <div class="workflow-header">
                                <h2>${workflowName}</h2>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="workflow-info">
                                <span>📅 Latest Run: <strong>${runDate}</strong></span>
                                <span>👤 Triggered By: <strong>${latestRun.actor?.login || 'Unknown'}</strong></span>
                            </div>
                            <div class="workflow-status">
                                <h3>Recent Runs</h3>
                                ${workflowRuns.slice(0, 5).map((run, index) => {
                                    const runTime = new Date(run.created_at).toLocaleDateString('en-US', {
                                        month: 'short',
                                        day: 'numeric',
                                        hour: '2-digit',
                                        minute: '2-digit'
                                    });
                                    
                                    let runStatus = '⏳';
                                    if (run.conclusion === 'success') runStatus = '✅';
                                    else if (run.conclusion === 'failure') runStatus = '❌';
                                    else if (run.conclusion === 'cancelled') runStatus = '⊘';
                                    else if (run.status === 'in_progress') runStatus = '⚙️';
                                    
                                    return `
                                        <div class="run-item">
                                            <span><span class="status-icon">${runStatus}</span> Run ${index + 1}</span>
                                            <span class="run-time">${runTime}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = workflowsHTML;
                
            } catch (error) {
                console.error('Error loading workflows:', error);
                container.innerHTML = `
                    <div class="no-workflows">
                        <p>⚠️ Unable to load workflow data. Please try again later.</p>
                        <p style="font-size: 0.9em; margin-top: 10px; color: #999;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Load workflows when page loads
        document.addEventListener('DOMContentLoaded', loadWorkflows);
        
        // Refresh workflows every 2 minutes
        setInterval(loadWorkflows, 2 * 60 * 1000);
    </script>
</body>
</html>
