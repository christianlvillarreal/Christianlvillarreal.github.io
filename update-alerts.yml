name: Update Alerts on Release

on:
  release:
    types: [published, edited]

jobs:
  update-alerts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: root
      
      - name: Get release information
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/latest)
          RELEASE_TAG=$(echo $RELEASE_DATA | jq -r '.tag_name')
          RELEASE_NAME=$(echo $RELEASE_DATA | jq -r '.name')
          RELEASE_BODY=$(echo $RELEASE_DATA | jq -r '.body')
          RELEASE_DATE=$(echo $RELEASE_DATA | jq -r '.published_at')
          RELEASE_AUTHOR=$(echo $RELEASE_DATA | jq -r '.author.login')
          
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "body=$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "author=$RELEASE_AUTHOR" >> $GITHUB_OUTPUT
      
      - name: Generate alerts HTML
        run: |
          cat > alerts.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>URGENTWIRE - Alerts</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: Arial, sans-serif;
                      background-color: #f5f5f5;
                      color: #333;
                  }
                  
                  header {
                      background-color: #c41e3a;
                      color: white;
                      padding: 20px;
                      text-align: center;
                  }
                  
                  header h1 {
                      font-size: 2.5em;
                      margin-bottom: 5px;
                  }
                  
                  header p {
                      font-size: 1em;
                      opacity: 0.9;
                  }
                  
                  nav {
                      background-color: #333;
                      padding: 10px 0;
                      text-align: center;
                  }
                  
                  nav a {
                      color: white;
                      text-decoration: none;
                      margin: 0 20px;
                      font-weight: bold;
                  }
                  
                  nav a:hover {
                      color: #c41e3a;
                  }
                  
                  .container {
                      max-width: 900px;
                      margin: 30px auto;
                      padding: 0 20px;
                  }
                  
                  .alerts-section {
                      background-color: white;
                      padding: 30px;
                      border-radius: 8px;
                      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                  }
                  
                  .alerts-section h2 {
                      color: #c41e3a;
                      margin-bottom: 20px;
                      border-bottom: 3px solid #c41e3a;
                      padding-bottom: 10px;
                  }
                  
                  .alert-item {
                      background-color: #fff3cd;
                      border-left: 5px solid #ffc107;
                      padding: 20px;
                      margin-bottom: 20px;
                      border-radius: 5px;
                  }
                  
                  .alert-item.critical {
                      background-color: #f8d7da;
                      border-left-color: #dc3545;
                  }
                  
                  .alert-title {
                      font-size: 1.5em;
                      font-weight: bold;
                      color: #333;
                      margin-bottom: 10px;
                  }
                  
                  .alert-tag {
                      display: inline-block;
                      background-color: #c41e3a;
                      color: white;
                      padding: 5px 10px;
                      border-radius: 3px;
                      font-size: 0.85em;
                      font-weight: bold;
                      margin-bottom: 10px;
                  }
                  
                  .alert-content {
                      line-height: 1.6;
                      font-size: 1em;
                      white-space: pre-wrap;
                      word-wrap: break-word;
                  }
                  
                  .alert-meta {
                      color: #666;
                      font-size: 0.9em;
                      margin-top: 10px;
                      font-style: italic;
                  }
                  
                  footer {
                      background-color: #333;
                      color: white;
                      text-align: center;
                      padding: 20px;
                      margin-top: 40px;
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1>URGENTWIRE</h1>
                  <p>Get Local news, weather updates, or outbreaks for Laredo Texas</p>
              </header>
              
              <nav>
                  <a href="index.html">Home</a>
                  <a href="alerts.html">Alerts</a>
                  <a href="weather.html">Weather</a>
                  <a href="news.html">News</a>
              </nav>
              
              <div class="container">
                  <div class="alerts-section">
                      <h2>⚠️ Active Alerts</h2>
                      
                      <div class="alert-item critical">
                          <div class="alert-tag">${{ steps.release.outputs.tag }}</div>
                          <div class="alert-title">${{ steps.release.outputs.name }}</div>
                          <div class="alert-content">${{ steps.release.outputs.body }}</div>
                          <div class="alert-meta">
                              Published: ${{ steps.release.outputs.date }} | By: ${{ steps.release.outputs.author }}
                          </div>
                      </div>
                      
                  </div>
              </div>
              
              <footer>
                  <p>&copy; 2026 URGENTWIRE. Stay informed, stay safe.</p>
              </footer>
          </body>
          </html>
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add alerts.html
          git commit -m "Auto-update alerts from release: ${{ steps.release.outputs.name }}"
          git push
