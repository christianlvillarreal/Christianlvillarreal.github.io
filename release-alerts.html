<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Alerts - URGENTWIRE REPORT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #0047AB 0%, #1E90FF 50%, #00BFFF 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            background: rgba(0, 0, 0, 0.3);
            color: #000;
            padding: 40px 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 
                         0 0 20px rgba(0, 0, 0, 0.6),
                         0 0 30px rgba(0, 0, 0, 0.4);
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .back-button {
            display: inline-block;
            background: rgba(0, 0, 0, 0.4);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
        }
        
        .release-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .release-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #0047AB;
        }
        
        .release-header h2 {
            color: #0047AB;
            font-size: 1.8em;
        }
        
        .release-badge {
            background: #0047AB;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .release-badge.new {
            background: #DC143C;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(220, 20, 60, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 20, 60, 0);
            }
        }
        
        .release-info {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
        }
        
        .release-info span {
            display: inline-block;
            margin-right: 20px;
        }
        
        .release-description {
            color: #333;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        
        .release-features {
            background: rgba(0, 71, 171, 0.05);
            padding: 15px;
            border-left: 4px solid #0047AB;
            border-radius: 5px;
            margin: 15px 0;
        }
        
        .release-features h3 {
            color: #0047AB;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .release-features ul {
            list-style: none;
            padding-left: 0;
        }
        
        .release-features li {
            color: #333;
            padding: 5px 0;
            padding-left: 25px;
            position: relative;
        }
        
        .release-features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #0047AB;
            font-weight: bold;
        }
        
        .no-releases {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .no-releases p {
            color: #666;
            font-size: 1.1em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #000;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #000;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        footer {
            background: rgba(0, 0, 0, 0.5);
            color: #000;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>🚨 Release Alerts</h1>
        <p>URGENTWIRE REPORT - Latest Updates & New Releases</p>
    </header>
    
    <div class="container">
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div id="releases-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading release information...</p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 URGENTWIRE REPORT - Release Alerts | All rights reserved.</p>
    </footer>
    
    <script>
        async function loadReleases() {
            const container = document.getElementById('releases-container');
            
            try {
                // Fetch releases from GitHub API
                const response = await fetch(
                    'https://api.github.com/repos/christianlvillarreal/Christianlvillarreal.github.io/releases'
                );
                
                if (!response.ok) {
                    throw new Error('Failed to fetch releases');
                }
                
                const releases = await response.json();
                
                if (releases.length === 0) {
                    container.innerHTML = `
                        <div class="no-releases">
                            <p>📭 No releases yet. Check back soon for updates!</p>
                        </div>
                    `;
                    return;
                }
                
                let releasesHTML = '';
                
                releases.forEach((release, index) => {
                    const isNew = index === 0; // First release is the newest
                    const releaseDate = new Date(release.published_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    const badgeClass = isNew ? 'release-badge new' : 'release-badge';
                    const badgeText = isNew ? '🆕 NEW RELEASE' : 'Released';
                    
                    releasesHTML += `
                        <div class="release-container">
                            <div class="release-header">
                                <h2>${release.name || release.tag_name}</h2>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="release-info">
                                <span>📌 Version: <strong>${release.tag_name}</strong></span>
                                <span>📅 Released: <strong>${releaseDate}</strong></span>
                            </div>
                            ${release.body ? `
                                <div class="release-description">
                                    ${escapeHtml(release.body).replace(/\n/g, '<br>')}
                                </div>
                            ` : '<div class="release-description"><em>No description provided</em></div>'}
                            ${release.assets && release.assets.length > 0 ? `
                                <div class="release-features">
                                    <h3>📦 Downloads</h3>
                                    <ul>
                                        ${release.assets.map(asset => `
                                            <li><a href="${asset.browser_download_url}" target="_blank">${asset.name}</a></li>
                                        `).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                
                container.innerHTML = releasesHTML;
                
            } catch (error) {
                console.error('Error loading releases:', error);
                container.innerHTML = `
                    <div class="no-releases">
                        <p>⚠️ Unable to load releases. Please try again later.</p>
                        <p style="font-size: 0.9em; margin-top: 10px; color: #999;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load releases when page loads
        document.addEventListener('DOMContentLoaded', loadReleases);
        
        // Refresh releases every 5 minutes
        setInterval(loadReleases, 5 * 60 * 1000);
    </script>
</body>
</html>
